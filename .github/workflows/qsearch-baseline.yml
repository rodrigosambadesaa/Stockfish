name: Baseline qsearch search verification

on:
  push:
    branches:
      - baseline/qsearch-tt-mate-guard-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Fetch NNUE nets
        run: make -C src net
      - name: Build Stockfish
        run: make -C src -j2 build ARCH=x86-64
      - name: Bench signature
        working-directory: src
        run: bash ../tests/signature.sh
      - name: Reproduce reported MultiPV mate behavior
        working-directory: src
        run: |
          python3 - <<'PY'
          import subprocess
          commands = [
              "uci",
              "setoption name Threads value 1",
              "setoption name Hash value 16",
              "setoption name MultiPV value 256",
              "position fen 8/1pNKp3/1B2P3/1P6/1pNP4/1k6/1P6/1B6 w - - 0 1",
              "go nodes 8000000",
              "ucinewgame",
              "quit",
          ]
          p = subprocess.run(["./stockfish"], input="\n".join(commands)+"\n",
                             capture_output=True, text=True, timeout=240)
          print("Engine exit:",p.returncode)
          lines = [x for x in p.stdout.splitlines() if " pv c7a8" in x]
          print("MultiPV lines beginning c7a8:",len(lines))
          for x in lines[-5:]: print(x[:350])
          if p.returncode or not any(x.startswith("bestmove ") for x in p.stdout.splitlines()):
              print(p.stdout[-2500:]); raise SystemExit("Engine run failed")
          PY
