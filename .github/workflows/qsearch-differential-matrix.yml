name: Qsearch TT differential matrix (non-Fishtest)

on:
  push:
    branches:
      - validation/qsearch-tt-mate-matrix-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [small, large, diverse]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: candidate
          persist-credentials: false
      - name: Checkout identical upstream baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: official-stockfish/Stockfish
          ref: effdc3fd3f6de6e75fe1374a51a7a7eed66f880b
          path: baseline
          persist-credentials: false
      - name: Install python chess
        run: python3 -m pip install --user python-chess==1.999
      - name: Build baseline
        run: make -C baseline/src net && make -C baseline/src -j2 build ARCH=x86-64
      - name: Build candidate
        run: make -C candidate/src net && make -C candidate/src -j2 build ARCH=x86-64
      - name: Compare many UCI searches
        run: python3 candidate/validation/tt_mate_matrix.py baseline/src/stockfish candidate/src/stockfish --suite "${{ matrix.suite }}"
      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mate-matrix-${{ matrix.suite }}
          path: mate-matrix-*.json
          if-no-files-found: ignore
