name: Qsearch mate evidence against published cases
on:
  push:
    branches:
      - validation/qsearch-mate-evidence-2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        issue_case: [A, B, C]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: official-stockfish/Stockfish
          ref: effdc3fd3f6de6e75fe1374a51a7a7eed66f880b
          path: baseline
          persist-credentials: false
      - name: Install python-chess
        run: python3 -m pip install --user python-chess==1.999
      - name: Compile baseline
        run: make -C baseline/src net && make -C baseline/src -j2 build ARCH=x86-64
      - name: Compile candidate
        run: make -C candidate/src net && make -C candidate/src -j2 build ARCH=x86-64
      - name: Compare reported mate lines
        run: python3 candidate/validation/mate_evidence.py --case ${{ matrix.issue_case }} --base baseline/src/stockfish --candidate candidate/src/stockfish
      - name: Store all UCI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mate-evidence-${{ matrix.issue_case }}
          path: mate-evidence-*.json
          if-no-files-found: ignore
